name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  regimes:
    name: Full benchmark regimes
    runs-on: ubuntu-24.04
    container: gcc:16.2.0-trixie
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends libgtest-dev ninja-build python3 python3-pip
          python3 -m pip install --break-system-packages --no-cache-dir cmake==4.4.3

      - name: Configure and build Release
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2

      - name: Record environment
        run: |
          mkdir -p benchmark-results
          g++ --version > benchmark-results/environment.txt
          cmake --version >> benchmark-results/environment.txt
          python3 --version >> benchmark-results/environment.txt
          uname -a >> benchmark-results/environment.txt
          echo "commit=${GITHUB_SHA}" >> benchmark-results/environment.txt

      - name: Run benchmark regimes
        run: |
          python3 tools/benchmark.py \
            --runner build/release/src/rangequery_benchmark \
            --output benchmark-results/regimes.csv \
            --scenario regimes \
            --repetitions 3 \
            --seed 0 \
            --build-config Release

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-regimes-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 30
